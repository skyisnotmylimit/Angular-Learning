<form>
  <div class="input-group">
    <span>
      <label for="initial-investment">INITIAL INVESTMENT</label>
      <input id="initial-investment" type="number" [(ngModel)]="initialInvestmentInput" name="initialInvestment">
    </span>
    <span>
      <label for="annual-investment">ANNUAL INVESTMENT</label>
      <input id="annual-investment" type="number" [(ngModel)]="annualInvestmentInput" name="annualInvestment">
    </span>
  </div>
  <div class="input-group">
    <span>
      <label for="expected-return">EXPECTED RETURN</label>
      <input id="expected-return" type="number" [(ngModel)]="expectedReturnInput" name="expectedReturn">
    </span>
    <span>
      <label for="duration">DURATION</label>
      <input id="duration" type="number" [(ngModel)]="durationInput" name="duration">
    </span>
  </div>
  <div>
    <button (click)="onCalculate()" type="button">Calculate</button>
  </div>
</form>
