<section class="mx-auto mt-6 w-full max-w-6xl px-4 pb-10 sm:px-6 lg:px-8">
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-xl font-semibold text-slate-900">Form Mode</h2>
    <p class="mt-1 text-sm text-slate-600">Template-only UI preview for both Template Driven and Reactive forms.</p>

    <div class="mt-6 flex flex-wrap items-center gap-3 rounded-lg border border-slate-200 bg-slate-50 p-3">
      <span class="text-sm font-medium text-slate-700">Template Driven</span>

      <div class="relative inline-flex items-center">
        <input
          id="switch-component"
          type="checkbox"
          class="peer sr-only"
          [checked]="isReactiveForm()"
          (change)="onToggleChange()"
        />
        <label
          for="switch-component"
          class="h-6 w-11 cursor-pointer rounded-full bg-slate-200 transition-colors duration-300 peer-checked:bg-slate-800"
          aria-label="Switch form type"
        ></label>
        <span
          class="pointer-events-none absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow-sm transition-transform duration-300 peer-checked:translate-x-5"
        ></span>
      </div>

      <span class="text-sm font-medium text-slate-700">Reactive</span>
    </div>
    <div class="mt-8">
      @if (!isReactiveForm()) {
      <form #tdForm="ngForm" class="rounded-lg border border-slate-200 bg-slate-50 p-5 sm:p-6" (ngSubmit)="onTdFormSubmit(tdForm)" novalidate>
        <h3 class="mb-4 text-base font-semibold text-slate-900">Template Driven Form</h3>

        <div class="space-y-4">
          <div>
            <label for="td-name" class="mb-1 block text-sm font-medium text-slate-700">Full Name</label>
            <input id="td-name" name="name" type="text" placeholder="Enter full name" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200" [(ngModel)]="templateDrivenFormData.name" />
          </div>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div>
              <label for="td-age" class="mb-1 block text-sm font-medium text-slate-700">Age</label>
              <input id="td-age" name="age" type="number" min="1" max="120" placeholder="25" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200" [(ngModel)]="templateDrivenFormData.age" />
            </div>
            <div>
              <label for="td-dob" class="mb-1 block text-sm font-medium text-slate-700">Date of Birth</label>
              <input id="td-dob" name="dob" type="date" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-200" [(ngModel)]="templateDrivenFormData.dob" />
            </div>
          </div>

          <div>
            <label for="td-email" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
            <input id="td-email" name="email" type="email" placeholder="name@example.com" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200" [(ngModel)]="templateDrivenFormData.email" />
          </div>

          <div>
            <label for="td-address" class="mb-1 block text-sm font-medium text-slate-700">Address</label>
            <textarea id="td-address" name="address" rows="3" placeholder="Street, city, postal code" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200" [(ngModel)]="templateDrivenFormData.address"></textarea>
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <button type="submit" class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-800">Submit</button>
          <button type="reset" class="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100">Clear</button>
        </div>
      </form>
    } @else {
      <form [formGroup]="reactiveFormData" (ngSubmit)="onReactiveFormSubmit()" class="rounded-lg border border-slate-200 bg-slate-50 p-5 sm:p-6" novalidate>
        <h3 class="mb-4 text-base font-semibold text-slate-900">Reactive Form</h3>

        <div class="space-y-4">
          <div>
            <label for="rf-username" class="mb-1 block text-sm font-medium text-slate-700">Username</label>
            <input formControlName="userName" id="rf-username" type="text" placeholder="Enter username" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200" />
          </div>

          <div>
            <label for="rf-password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
            <input formControlName="password" id="rf-password" type="password" placeholder="Enter password" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200" />
          </div>

          <div>
            <label for="rf-role" class="mb-1 block text-sm font-medium text-slate-700">Role</label>
            <select formControlName="role" id="rf-role" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-200">
              <option value="">Select role</option>
              <option>User</option>
              <option>Admin</option>
              <option>Viewer</option>
            </select>
          </div>

          <fieldset class="space-y-2">
            <legend class="text-sm font-medium text-slate-700">Preferred Contact</legend>
            <label class="flex items-center gap-2 text-sm text-slate-700">
              <input formControlName="preferedContact" type="radio" name="rf-contact" value="Email" class="h-4 w-4 border-slate-300 text-slate-900" />
              Email
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-700">
              <input formControlName="preferedContact" type="radio" name="rf-contact" value="Phone" class="h-4 w-4 border-slate-300 text-slate-900" />
              Phone
            </label>
          </fieldset>

          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input formControlName="acceptTermsConditions" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-slate-900" />
            Accept terms and conditions
          </label>
        </div>

        <div class="mt-6 flex gap-3">
          <button type="submit" class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-800">Submit</button>
          <button type="reset" class="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100">Clear</button>
        </div>
      </form>
    }
    </div>
    <div>
      <p>{{formSubmitedData()}}</p>
    </div>
  </div>
</section>
