<section class="rounded-lg border border-slate-200 bg-slate-50 p-4">
  <h2 class="mb-4 text-lg font-medium text-slate-900">Available Phones</h2>

  <div class="h-[70vh] space-y-4 overflow-y-auto pr-1">
    @for(phone of allPhones();track phone.id) {
      <article appHoverPopup class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm"
      (click)="onListItemClick(phone.id)"
      >
        <h3 class="mb-3 text-base font-semibold text-slate-900">{{phone.name}}</h3>

        @if (phone.data) {
          <table class="w-full overflow-hidden rounded-md border border-slate-200 text-sm">
            <tbody>
              @for(dt of phone.data | keyvalue;track dt.key){
                <tr class="border-b border-slate-100 last:border-b-0">
                  <th class="w-1/2 bg-slate-50 px-3 py-2 text-left font-medium text-slate-700">
                    {{dt.key}}
                  </th>
                  <td class="px-3 py-2 text-slate-800">
                    {{dt.value}}
                  </td>
                </tr>
              }
            </tbody>
          </table>
        } @else {
          <p class="text-sm text-slate-500">No additional details available.</p>
        }
      </article>
    }
  </div>
</section>
